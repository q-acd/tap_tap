<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6750A4">
<title>Tap&amp;Tap — Galaxy Edition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.6.0/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WSSEELHL51"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-WSSEELHL51');
</script>
<style>
:root{
  --primary:#6750A4;
  --primary-container:#EADDFF;
  --on-primary:#FFFFFF;
  --on-primary-container:#21005D;
  --surface:#FEF7FF;
  --surface-2:#F3EDF7;
  --surface-3:#ECE6F0;
  --on-surface:#1D1B20;
  --on-surface-var:#49454F;
  --outline-var:#CAC4D0;
  --success:#2E7D32;
  --gold:#FFB300;
  --danger:#B3261E;
  --radius:20px;
  --radius-lg:28px;
  --shadow-1:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-2:0 4px 12px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
  --shadow-3:0 10px 28px rgba(0,0,0,.16), 0 4px 8px rgba(0,0,0,.08);
  --btn-grad:linear-gradient(135deg,#2196F3,#2196F3);
  --tap-size:200px;
  --wallpaper:linear-gradient(135deg,#FEF7FF,#EADDFF);
}
[data-ui="dark"]{
  --surface:#141218;
  --surface-2:#1D1B20;
  --surface-3:#25232A;
  --on-surface:#E6E0E9;
  --on-surface-var:#CAC4D0;
  --outline-var:#49454F;
  --wallpaper:linear-gradient(135deg,#0A0A0F,#141218);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--surface);color:var(--on-surface);overflow:hidden;user-select:none;transition:background .35s ease,color .35s ease;}

#bgLayer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.bg-particle{position:absolute;top:-40px;pointer-events:none;user-select:none;font-size:22px;opacity:.85;}
.bg-particle.leaf{animation:leafFall linear infinite;font-size:26px;}
.bg-particle.rain{animation:rainFall linear infinite;font-size:18px;}
.bg-particle.snow{animation:snowFall linear infinite;font-size:22px;}
@keyframes leafFall{
  0%{transform:translateY(-40px) rotate(0deg) translateX(0);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translateY(110vh) rotate(720deg) translateX(80px);opacity:.7;}
}
@keyframes rainFall{
  0%{transform:translateY(-40px);opacity:0;}
  10%{opacity:.9;}
  100%{transform:translateY(110vh);opacity:.6;}
}
@keyframes snowFall{
  0%{transform:translateY(-40px) translateX(0) rotate(0deg);opacity:0;}
  10%{opacity:.95;}
  100%{transform:translateY(110vh) translateX(30px) rotate(180deg);opacity:.7;}
}

#loader{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,var(--primary) 0%,var(--btn-color, #2196F3) 55%,var(--primary) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:24px;transition:opacity .6s, visibility .6s, background .35s ease;}
#loader.hide{opacity:0;visibility:hidden;}
.loader-logo{font-size:60px;font-weight:800;letter-spacing:-2px;text-shadow:0 8px 30px rgba(0,0,0,.3);animation:pop 2.4s ease-in-out infinite;}
.loader-logo i{margin-right:10px;}
@keyframes pop{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.loader-bar{width:min(320px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;}
.loader-bar>div{height:100%;width:0%;background:#fff;border-radius:99px;transition:width .25s ease;}
.loader-hint{font-size:13px;opacity:.85;letter-spacing:.4px;}

#app{display:none;height:100dvh;grid-template-rows:auto 1fr auto;max-width:520px;margin:0 auto;background:var(--wallpaper);background-size:cover;background-position:center;position:relative;transition:background .5s ease;z-index:1;}
#app.ready{display:grid;}

#topBar{position:relative;display:flex;align-items:center;justify-content:center;padding:12px 16px 6px;min-height:48px;background:transparent;}
#tabTitle,#gameName{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:800;letter-spacing:2px;text-transform:uppercase;transition:opacity .28s ease, transform .28s ease;cursor:pointer;color:var(--on-surface);}
#gameName{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(-6px);background:linear-gradient(135deg,var(--primary),#2196F3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#topBar.showGame #tabTitle{opacity:0;transform:translateX(-50%) translateY(6px);}
#topBar.showGame #gameName{opacity:1;transform:translateX(-50%) translateY(0);}
#settingsTopBtn,#tutorialBtn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--outline-var);color:var(--on-surface);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s, background .2s;}
#settingsTopBtn{right:12px;}
#tutorialBtn{left:12px;}
#settingsTopBtn:active,#tutorialBtn:active{transform:translateY(-50%) scale(.92);}

.top-tabs{display:flex;gap:6px;padding:0 12px 8px;background:transparent;position:sticky;top:0;z-index:20;justify-content:center;}
.top-tab{width:44px;height:44px;border-radius:50%;background:var(--surface-2);color:var(--on-surface-var);font-weight:600;font-size:16px;cursor:pointer;border:1px solid var(--outline-var);transition:all .2s;display:flex;align-items:center;justify-content:center;}
.top-tab.active{background:var(--primary-container);color:var(--on-primary-container);box-shadow:var(--shadow-1);}
[data-ui="dark"] .top-tab.active{background:var(--surface-3);color:var(--on-surface);border:1px solid var(--primary);}

.screen{display:none;overflow-y:auto;overflow-x:hidden;padding:8px 16px 24px;-webkit-overflow-scrolling:touch;}
.screen.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

.bottom-nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border-top:1px solid var(--outline-var);padding:8px 6px calc(8px + env(safe-area-inset-bottom));position:relative;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:16px;background:transparent;border:none;color:var(--on-surface-var);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit;position:relative;}
.nav-item i{font-size:18px;}
.nav-item.active{color:var(--on-primary-container);background:var(--primary-container);}
[data-ui="dark"] .nav-item.active{background:var(--surface-3);color:var(--on-surface);border:1px solid var(--primary);}
.nav-item .nav-badge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px var(--surface-2);}

.score-card{background:var(--surface-2);border-radius:var(--radius-lg);padding:20px 16px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow-1);transition:box-shadow .3s, background .3s;}
.score-card.penalty{background:rgba(179,38,30,.15);box-shadow:0 0 0 3px var(--danger), 0 0 24px rgba(179,38,30,.6);animation:penaltyShake .5s ease;}
@keyframes penaltyShake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.score-label{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--on-surface-var);font-weight:600;}
.score-value{font-size:42px;font-weight:800;letter-spacing:-1px;margin:4px 0;background:linear-gradient(135deg,var(--primary),#2196F3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;transition:transform .15s;word-break:break-all;line-height:1.1;}
.score-value.pulse{transform:scale(1.06);}
.score-sub{font-size:13px;color:var(--on-surface-var);font-weight:500;}

.tap-wrap{position:relative;display:flex;justify-content:center;align-items:center;margin:16px 0 24px;min-height:260px;}
#tapBtn{width:var(--tap-size);height:var(--tap-size);border-radius:50%;border:none;background:var(--btn-grad);color:#fff;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(0,0,0,.20),inset 0 -6px 20px rgba(0,0,0,.15),inset 0 6px 20px rgba(255,255,255,.25);transition:transform .08s ease;overflow:hidden;font-weight:800;letter-spacing:1px;touch-action:manipulation;}
#tapBtn:active{transform:scale(.94);}
#tapBtn .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);opacity:.9;animation:ripple .6s ease-out forwards;pointer-events:none;}
@keyframes ripple{to{transform:scale(4);opacity:0;}}
#tapBtn .icon-fa{font-size:80px;line-height:1;}
#tapBtn .tap-text{font-size:48px;font-weight:800;letter-spacing:2px;}

.float-plus{position:absolute;pointer-events:none;font-weight:800;font-size:22px;color:var(--primary);animation:floatUp .9s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.15);z-index:5;}
@keyframes floatUp{0%{transform:translate(0,0) scale(.7);opacity:0;}20%{opacity:1;transform:translate(0,-10px) scale(1.1);}100%{transform:translate(var(--dx),-90px) scale(1);opacity:0;}}
.float-minus{position:absolute;pointer-events:none;font-weight:800;font-size:26px;color:var(--danger);animation:floatUp 1.4s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.25);z-index:8;}
.particle{position:absolute;pointer-events:none;font-size:16px;animation:particleFly .9s ease-out forwards;z-index:4;}
@keyframes particleFly{0%{transform:translate(0,0) scale(.4);opacity:1;}100%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0;}}

.boost-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.mini-boost{background:var(--surface-2);border-radius:16px;padding:10px 6px;text-align:center;border:1px solid var(--outline-var);}
.mini-boost .mv{font-weight:800;font-size:16px;color:var(--primary);}
.mini-boost .ml{font-size:10px;color:var(--on-surface-var);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

.section-title{font-size:18px;font-weight:700;margin:20px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title i{color:var(--primary);}
.hint{font-size:12px;color:var(--on-surface-var);margin-bottom:12px;line-height:1.4;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.card{background:var(--surface-2);border-radius:var(--radius);padding:14px;border:1px solid var(--outline-var);box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:8px;transition:transform .15s,box-shadow .2s;position:relative;overflow:hidden;}
.card:active{transform:scale(.98);}
.card.owned{border-color:var(--primary);background:var(--primary-container);}
[data-ui="dark"] .card.owned{background:var(--surface-2);border-width:2px;}
.card .lock{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--on-surface-var);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:var(--shadow-1);}
.card .preview{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;font-weight:800;margin:0 auto;box-shadow:inset 0 -4px 12px rgba(0,0,0,.15),inset 0 4px 12px rgba(255,255,255,.2);}
.card .preview.emoji-preview{background:var(--surface-3)!important;box-shadow:none;font-size:30px;}
.card .name{font-size:13px;font-weight:700;text-align:center;}
.card .price{font-size:12px;font-weight:700;text-align:center;color:var(--on-surface-var);display:flex;align-items:center;justify-content:center;gap:4px;}
.card .buy-btn{border:none;border-radius:12px;padding:8px;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;background:var(--primary);color:var(--on-primary);font-family:inherit;}
.card .buy-btn:disabled{opacity:.5;cursor:not-allowed;}
.card .buy-btn.owned-btn{background:var(--success);color:#fff;}
.card .buy-btn.equipped-btn{background:var(--gold);color:#000;}

.boost-card{background:var(--surface-2);border-radius:var(--radius);padding:16px;border:1px solid var(--outline-var);box-shadow:var(--shadow-1);margin-bottom:12px;}
.boost-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.boost-title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
.boost-title i{color:var(--primary);font-size:18px;}
.boost-lvl{background:var(--primary);color:var(--on-primary);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
.boost-desc{font-size:13px;color:var(--on-surface-var);margin-bottom:12px;line-height:1.4;}
.boost-progress{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:12px;position:relative;}
.boost-progress>div{height:100%;background:linear-gradient(90deg,var(--primary),#2196F3);border-radius:99px;transition:width .4s ease;}
.boost-progress .tick{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--outline-var);}
.boost-action{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.boost-cost{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;}
.boost-cost i{color:var(--gold);}

.btn{border:none;border-radius:14px;padding:10px 18px;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;background:var(--primary);color:var(--on-primary);display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.btn:active{transform:scale(.96);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.secondary{background:var(--surface-3);color:var(--on-surface);}
.btn.success{background:var(--success);color:#fff;}
.btn.danger{background:var(--danger);color:#fff;}

.task-card{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:14px;border:1px solid var(--outline-var);margin-bottom:10px;box-shadow:var(--shadow-1);}
.task-icon{width:48px;height:48px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:linear-gradient(135deg,var(--primary),#2196F3);}
.task-body{flex:1;min-width:0;}
.task-name{font-weight:700;font-size:14px;margin-bottom:3px;}
.task-reward{font-size:12px;color:var(--on-surface-var);font-weight:600;}
.task-reward b{color:var(--gold);}

.daily-card{background:linear-gradient(135deg,var(--primary),#7C4DFF);color:#fff;border-radius:var(--radius-lg);padding:20px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow-2);}
.daily-card .dc-title{font-size:14px;opacity:.9;font-weight:600;margin-bottom:6px;}
.daily-card .dc-streak{font-size:34px;font-weight:800;margin-bottom:4px;}
.daily-card .dc-desc{font-size:13px;opacity:.9;margin-bottom:14px;}
.daily-card .btn{background:#fff;color:var(--primary);}
.daily-dots{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
.dd{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.3);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;}
.dd.on{background:#fff;color:var(--primary);}

.ach-card{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:var(--radius);padding:12px 14px;border:1px solid var(--outline-var);margin-bottom:8px;box-shadow:var(--shadow-1);transition:all .3s;}
.ach-card.unlocked{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,179,0,.12),transparent);}
.ach-emoji{font-size:30px;flex-shrink:0;width:44px;text-align:center;}
.ach-body{flex:1;min-width:0;}
.ach-name{font-weight:700;font-size:14px;}
.ach-req{font-size:12px;color:var(--on-surface-var);font-weight:600;}
.ach-status{font-size:22px;color:var(--outline-var);}
.ach-card.unlocked .ach-status{color:var(--gold);}

.profile-box{background:linear-gradient(135deg,var(--primary),#2196F3);color:#fff;border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-2);}
.profile-box .pb-name{font-size:22px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.profile-box .pb-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.pb-stat{background:rgba(255,255,255,.18);border-radius:14px;padding:10px;}
.pb-stat .pv{font-size:18px;font-weight:800;}
.pb-stat .pl{font-size:11px;opacity:.9;font-weight:600;letter-spacing:.5px;}

.sort-tabs{display:flex;gap:6px;margin-bottom:12px;}
.sort-tab{flex:1;padding:8px;border-radius:999px;border:none;background:var(--surface-2);color:var(--on-surface-var);font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;}
.sort-tab.active{background:var(--primary);color:var(--on-primary);}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface-2);border-radius:14px;margin-bottom:6px;border:1px solid var(--outline-var);}
.hist-day{font-weight:700;font-size:14px;}
.hist-val{font-weight:800;font-size:15px;color:var(--primary);}
.hist-val.pos{color:var(--success);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--on-surface-var);margin-bottom:6px;}
.field input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--outline-var);background:var(--surface-2);color:var(--on-surface);font-size:15px;font-family:inherit;font-weight:600;outline:none;transition:all .2s;}
.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-container);}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;}
.row-btns .btn{flex:1;justify-content:center;}

.toggle-row{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:1px solid var(--outline-var);}
.toggle-row .tr-label{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;}
.switch{position:relative;width:48px;height:26px;border-radius:99px;background:var(--surface-3);cursor:pointer;transition:background .25s;border:none;padding:0;flex-shrink:0;}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s, background .25s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.switch.on{background:var(--primary);}
.switch.on::after{transform:translateX(22px);}

.lang-btns{display:flex;gap:6px;}
.lang-btn{padding:6px 12px;border-radius:99px;border:1px solid var(--outline-var);background:var(--surface-3);color:var(--on-surface-var);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s;}
.lang-btn.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

.music-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.music-btn{padding:10px;border-radius:14px;border:1px solid var(--outline-var);background:var(--surface-3);color:var(--on-surface);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.music-btn.active{background:var(--primary);color:var(--on-primary);border-color:var(--primary);}

.wallpaper-card{cursor:pointer;}
.wallpaper-card .wp-preview{width:100%;height:80px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
[data-ui="dark"] .wallpaper-card .wp-preview{filter:brightness(.55) saturate(.85);}

.modal-bg{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;}
.modal-bg.show{display:flex;animation:fadeUp .25s ease;}
.modal{background:var(--surface);border-radius:28px;padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow-3);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.5,1);max-height:88vh;overflow-y:auto;}
.modal h2{margin:0 0 8px;font-size:22px;font-weight:800;}
.modal p{margin:0 0 16px;color:var(--on-surface-var);font-size:14px;line-height:1.5;}
.modal .big-emoji{font-size:56px;margin-bottom:8px;display:block;}
.modal .btn{width:100%;justify-content:center;margin-top:8px;}

.toast-ach{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(135deg,var(--primary),#2196F3);color:#fff;padding:14px 20px;border-radius:16px;font-weight:700;font-size:14px;box-shadow:var(--shadow-3);transition:transform .4s cubic-bezier(.2,1.4,.5,1);z-index:2500;display:flex;align-items:center;gap:10px;max-width:90vw;}
.toast-ach.show{transform:translateX(-50%) translateY(0);}
.toast-ach .ta-emoji{font-size:28px;}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(30px);background:var(--on-surface);color:var(--surface);padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:all .3s;z-index:2000;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#netBanner{position:fixed;top:0;left:0;right:0;z-index:2400;background:linear-gradient(135deg,#B3261E,#E65100);color:#fff;padding:14px 20px;font-size:13px;font-weight:600;line-height:1.45;text-align:center;transform:translateY(-120%);transition:transform .45s cubic-bezier(.2,1.2,.5,1);box-shadow:0 6px 24px rgba(0,0,0,.35);}
#netBanner.show{transform:translateY(0);}
#netBanner.ok{background:linear-gradient(135deg,#2E7D32,#43A047);}
#netBanner b{display:block;font-size:15px;font-weight:800;margin-bottom:4px;}
#netBanner small{opacity:.9;font-weight:500;}

.confetti{position:fixed;top:-30px;font-size:22px;pointer-events:none;z-index:3000;animation:confettiFall linear forwards;}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0deg);opacity:1;}100%{transform:translateY(105vh) rotate(720deg);opacity:0.8;}}

.thanks-grad{background:linear-gradient(135deg,#FFB300,#FF6F00,#7C4DFF,#2196F3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
#thanksName{cursor:pointer;}
.cyber-veg{background:linear-gradient(135deg,#00E676,#00B0FF,#AA00FF)!important;animation:cyberShift 3s linear infinite;}
@keyframes cyberShift{0%{filter:hue-rotate(0deg);}100%{filter:hue-rotate(360deg);}}
::-webkit-scrollbar{width:0;height:0;}

.lot-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px;}
.lot-tab{padding:14px 10px;border-radius:16px;border:1.5px solid var(--outline-var);background:var(--surface-2);color:var(--on-surface);font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;}
.lot-tab .lt-title{font-size:15px;}
.lot-tab .lt-sub{font-size:11px;color:var(--on-surface-var);font-weight:600;}
.lot-tab.active{border-color:var(--primary);background:var(--primary-container);color:var(--on-primary-container);}
[data-ui="dark"] .lot-tab.active{background:var(--surface-3);color:var(--on-surface);border-width:2px;}
.lot-tab:disabled{opacity:.4;cursor:not-allowed;}
.lot-tab .lt-lock{position:absolute;top:6px;right:8px;font-size:12px;color:var(--on-surface-var);}

.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
.reel{background:var(--surface-2);border-radius:16px;padding:24px 8px;font-size:44px;text-align:center;border:2px solid var(--outline-var);min-height:100px;display:flex;align-items:center;justify-content:center;transition:all .2s;overflow:hidden;}
.reel.spinning{animation:reelSpin .15s linear infinite;border-color:var(--primary);}
@keyframes reelSpin{0%{transform:translateY(0);opacity:1;}50%{transform:translateY(-8px);opacity:.7;}100%{transform:translateY(0);opacity:1;}}
.reel.win{border-color:var(--gold);box-shadow:0 0 20px rgba(255,179,0,.6);animation:winPulse .6s ease;}
@keyframes winPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

.lot-score{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px 14px;margin-bottom:14px;border:1px solid var(--outline-var);font-size:14px;font-weight:700;flex-wrap:wrap;}
.lot-score i{color:var(--gold);}
.lot-score .ls-value{color:var(--primary);font-size:16px;font-weight:800;}
.lot-score .ls-hint{font-size:11px;color:var(--on-surface-var);font-weight:600;}

.lot-info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.lot-info-item{background:var(--surface-2);border-radius:12px;padding:10px;border:1px solid var(--outline-var);text-align:center;font-size:12px;color:var(--on-surface-var);font-weight:600;}
.lot-info-item b{display:block;font-size:15px;color:var(--on-surface);font-weight:800;margin-top:2px;}

.tut-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
.tut-nav{display:flex;gap:8px;width:100%;margin-top:8px;}
.tut-nav .btn{flex:1;justify-content:center;}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-top:14px;}
.tut-dot{width:8px;height:8px;border-radius:50%;background:var(--outline-var);transition:background .2s, transform .2s;}
.tut-dot.active{background:var(--primary);transform:scale(1.3);}

@media (max-width:400px){
  :root{--tap-size:170px;}
  .score-value{font-size:36px;}
  #tapBtn .icon-fa{font-size:64px;}
  #tapBtn .tap-text{font-size:38px;}
  .reel{font-size:34px;padding:18px 4px;min-height:80px;}
  .music-btn{font-size:11px;padding:8px 6px;}
}

function load(){
  try{
    const raw = localStorage.getItem('taptap_gold_v1');
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    const merged = Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), parsed);
    merged.ownedThemes = Array.isArray(merged.ownedThemes) ? merged.ownedThemes : ['blue'];
    merged.ownedIcons  = Array.isArray(merged.ownedIcons)  ? merged.ownedIcons  : ['tap'];
    merged.ownedWallpapers = Array.isArray(merged.ownedWallpapers) ? merged.ownedWallpapers : ['default'];
    merged.unlockedAch = Array.isArray(merged.unlockedAch) ? merged.unlockedAch : [];
    merged.achNotified = Array.isArray(merged.achNotified) ? merged.achNotified : [];
    merged.history     = Array.isArray(merged.history)     ? merged.history     : [];
    if(!merged.specialAch) merged.specialAch = {rapid:false,meloman:false,decorator:false,lucky:false,persistent:false,immortalAll:false};
    if(!merged.tasksProgress) merged.tasksProgress = {channel:false,share:false,review:false};
    if(!merged.ownedThemes.includes('blue')) merged.ownedThemes.push('blue');
    if(!merged.ownedIcons.includes('tap'))   merged.ownedIcons.push('tap');
    if(!merged.ownedWallpapers.includes('default')) merged.ownedWallpapers.push('default');
    if(!merged.lang) merged.lang = 'ru';
    if(typeof merged.clickBoostLvl !== 'number') merged.clickBoostLvl = 0;
    if(typeof merged.autoBoostLvl !== 'number') merged.autoBoostLvl = 0;
    if(typeof merged.clickPowerLvl !== 'number') merged.clickPowerLvl = 0;
    if(typeof merged.casinoLevel !== 'number' || merged.casinoLevel < 1) merged.casinoLevel = 1;
    if(!merged.bgAnimation) merged.bgAnimation = 'none';
    return merged;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }
}

function fmt(n){ n = Math.floor(n); if(n < 1000) return n.toString(); return n.toLocaleString('ru-RU'); }
function fmtShort(n){
  n = Math.floor(n);
  if(n < 1000) return n.toString();
  if(n < 1e6) return (n/1000).toFixed(n<10000?1:0)+'K';
  if(n < 1e9) return (n/1e6).toFixed(1)+'M';
  if(n < 1e12) return (n/1e9).toFixed(1)+'B';
  return (n/1e12).toFixed(1)+'T';
}

let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){ try{ _audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(_audioCtx.state === 'suspended'){ try{ _audioCtx.resume(); }catch(e){} }
  return _audioCtx;
}
function playSound(type){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const now = ctx.currentTime;
  if(type === 'ach'){
    [523.25, 659.25, 783.99].forEach((f, i)=>{
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.001, now + i*0.08);
      g.gain.exponentialRampToValueAtTime(0.15, now + i*0.08 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.08 + 0.25);
      osc.start(now + i*0.08); osc.stop(now + i*0.08 + 0.3);
    });
  } else if(type === 'win'){
    [659.25, 783.99, 1046.5].forEach((f, i)=>{
      const osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.value = f;
      g.gain.setValueAtTime(0.001, now + i*0.1);
      g.gain.exponentialRampToValueAtTime(0.12, now + i*0.1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now + i*0.1 + 0.3);
      osc.start(now + i*0.1); osc.stop(now + i*0.1 + 0.35);
    });
  } else if(type === 'lose'){
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(300, now);
    osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
    g.gain.setValueAtTime(0.12, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
    osc.start(now); osc.stop(now + 0.4);
  } else if(type === 'tap'){
    const osc = ctx.createOscillator(); const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(780 + Math.random()*60, now);
    osc.frequency.exponentialRampToValueAtTime(420, now + 0.055);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.055, now + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.07);
    osc.start(now); osc.stop(now + 0.08);
    const osc2 = ctx.createOscillator(); const g2 = ctx.createGain();
    osc2.connect(g2); g2.connect(ctx.destination);
    osc2.type = 'triangle';
    osc2.frequency.setValueAtTime(1500 + Math.random()*100, now);
    g2.gain.setValueAtTime(0.0001, now);
    g2.gain.exponentialRampToValueAtTime(0.018, now + 0.003);
    g2.gain.exponentialRampToValueAtTime(0.0001, now + 0.04);
    osc2.start(now); osc2.stop(now + 0.05);
  }
}

function upgradeCost(base, lvl, mult1, threshold, mult2){
  let cost = base;
  for(let i=0;i<lvl;i++) cost = Math.floor(cost * (i < threshold ? mult1 : mult2));
  return cost;
}
function clickBoostCost(){ return upgradeCost(100, S.clickBoostLvl, 5, 5, 8); }
function autoBoostCost(){  return upgradeCost(400, S.autoBoostLvl,  4, 3, 5); }
function clickPowerCost(){ return upgradeCost(500, S.clickPowerLvl, 3, 8, 3); }
function clickBoostMult(){ return Math.pow(2, S.clickBoostLvl); }
function autoBoostMult(){  return Math.pow(2, S.autoBoostLvl);  }
function clickPowerMult(){ return Math.pow(2, S.clickPowerLvl); }
function pointsPerClick(){ return 1 * clickPowerMult() * clickBoostMult(); }
function pointsPerSecond(){ return autoBoostMult() * clickPowerMult(); }

}

let _blockedUntil = 0;
let _rapidStart = 0;

function bindTap(){
  const btn = $('#tapBtn');
  const wrap = $('#tapWrap');
  if(!btn) return;

  btn.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    if(Date.now() < _blockedUntil) return;
    _blockedUntil = Date.now() + 40;

    const now = Date.now();
    if(now - _rapidStart < 200){
      S.rapidCombo++;
      if(S.rapidCombo >= 20 && !S.specialAch.rapid){
        S.specialAch.rapid = true;
        unlockSpecialAch('rapid');
      }
    } else { S.rapidCombo = 0; }
    _rapidStart = now;

    const gain = pointsPerClick();
    S.score += gain; S.totalEarned += gain; S.honestClicks++;
    playSound('tap');

    const rect = btn.getBoundingClientRect();
    const rip = document.createElement('span');
    rip.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    rip.style.width = rip.style.height = size+'px';
    rip.style.left = (e.clientX - rect.left - size/2)+'px';
    rip.style.top  = (e.clientY - rect.top  - size/2)+'px';
    btn.appendChild(rip);
    setTimeout(()=>rip.remove(), 650);

    const fp = document.createElement('div');
    fp.className = 'float-plus';
    fp.textContent = '+'+fmtShort(gain);
    const wr = wrap.getBoundingClientRect();
    fp.style.left = (e.clientX - wr.left - 20)+'px';
    fp.style.top  = (e.clientY - wr.top  - 20)+'px';
    fp.style.setProperty('--dx', (Math.random()*60-30)+'px');
    wrap.appendChild(fp);
    setTimeout(()=>fp.remove(), 950);

    for(let i=0; i<3; i++){
      const p = document.createElement('span');
      p.className = 'particle';
      p.textContent = ['✨','⭐','💫','🌟'][Math.floor(Math.random()*4)];
      p.style.left = (e.clientX - wr.left - 8)+'px';
      p.style.top = (e.clientY - wr.top - 8)+'px';
      p.style.setProperty('--dx', (Math.random()*100-50)+'px');
      p.style.setProperty('--dy', (-50-Math.random()*60)+'px');
      wrap.appendChild(p);
      setTimeout(()=>p.remove(), 900);
    }

    updateScoreUI();
    checkAchievements();
    checkEasterEggs();
    checkAnimationsUnlock();
    save();
  });

  btn.addEventListener('contextmenu', e=>e.preventDefault());
}

function dailyRewardForStreak(streak){ if(streak >= 15) return 7000; return 50 * Math.pow(2, streak-1); }
function dateKey(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayKey(){ return dateKey(new Date()); }
function yesterdayKey(){ const d = new Date(); d.setDate(d.getDate()-1); return dateKey(d); }
function canClaimDaily(){ return S.lastDailyClaimDate !== todayKey(); }
function nextStreakIfClaim(){
  const today = todayKey();
  if(S.lastDailyClaimDate === today) return S.dailyStreak;
  if(S.lastDailyClaimDate === yesterdayKey()) return Math.min(S.dailyStreak + 1, 15);
  return 1;
}

function renderTasks(){
  const s = $('#screen-tasks');
  const claimable = canClaimDaily();
  const nextStreak = nextStreakIfClaim();
  const reward = dailyRewardForStreak(nextStreak);
  const dots = Array.from({length:15}, (_,i)=>{
    const dayN = i+1;
    return `<div class="dd ${dayN<=S.dailyStreak?'on':''}">${dayN}</div>`;
  }).join('');

  s.innerHTML = `
    <div class="section-title"><i class="fa-solid fa-calendar-day"></i>${t('daily_title')}</div>
    <div class="daily-card">
      <div class="dc-title">${t('daily_streak')}: ${S.dailyStreak}/15</div>
      <div class="dc-streak">+${fmt(reward)}</div>
      <div class="dc-desc">${claimable ? t('daily_available') : t('daily_comeback')}</div>
      <div class="daily-dots">${dots}</div>
      <button class="btn" id="claimDaily" ${!claimable?'disabled':''}><i class="fa-solid fa-gift"></i> ${claimable?t('daily_claim'):t('daily_claimed')}</button>
    </div>
    <div class="section-title"><i class="fa-solid fa-list-check"></i>${t('tasks_title')}</div>
    ${taskHtml('channel','<i class="fa-solid fa-tower-broadcast"></i>','Подписаться на канал «Tap&Tap»',400,'https://max.ru/channel_TapTap')}
    ${taskHtml('share','<i class="fa-solid fa-share-nodes"></i>','Поделиться игрой с друзьями',600,'https://q-acd.github.io/tap_tap')}
    ${taskHtml('review','<i class="fa-solid fa-envelope"></i>','Написать отзыв',500,'mailto:q-acd@mail.ru')}
  `;

  $('#claimDaily')?.addEventListener('click', ()=>{
    if(!canClaimDaily()) return;
    const ns = nextStreakIfClaim();
    S.dailyStreak = ns;
    S.lastDailyClaimDate = todayKey();
    if(!S.specialAch.persistent){ S.specialAch.persistent = true; unlockSpecialAch('persistent'); }
    const r = dailyRewardForStreak(ns);
    S.score += r; S.totalEarned += r;
    save(); renderTasks(); updateScoreUI();
    toast(`+${fmt(r)} ${t('score')}! ${t('day_lbl')} ${ns}`);
  });

  $$('.task-card').forEach(card=>{
    const key = card.dataset.key;
    const link = card.dataset.link;
    const reward = parseInt(card.dataset.reward,10);
    const progress = S.tasksProgress[key];
    const done = S.tasksDone[key];

    card.querySelector('.task-go')?.addEventListener('click', ()=>{
      if(link.startsWith('mailto:')) window.location.href = link;
      else window.open(link,'_blank');
      if(!S.tasksProgress[key]){
        S.tasksProgress[key] = true;
        save();
        renderTasks();
        if(!done) toast(t('task_completed'));
      }
    });
    card.querySelector('.task-claim')?.addEventListener('click', ()=>{
      if(!S.tasksProgress[key]){
        toast(t('task_do_first'));
        return;
      }
      if(S.tasksDone[key]) return;
      S.tasksDone[key] = true;
      S.score += reward; S.totalEarned += reward;
      save(); renderTasks(); updateScoreUI();
      toast(`+${reward}! ${t('task_reward_got')}`);
    });
  });
}

  if(a.type === 'days')    return S.daysPlayed >= a.req;
  if(a.type === 'clicks')  return S.honestClicks >= a.req;
  if(a.type === 'boostmax') return S.clickBoostLvl>=MAX_LVL && S.autoBoostLvl>=MAX_LVL && S.clickPowerLvl>=MAX_LVL;
  if(a.type === 'special') return !!S.specialAch[a.id];
  return S.unlockedAch.includes(a.id);
}

function spinLottery(){
  const lvl = S.casinoLevel;
  const info = CASINO_LEVELS[lvl];
  if(S.score < info.cost){ toast(t('not_enough_spin')); return; }
  S.score -= info.cost;
  updateScoreUI();

  const reels = [$('#reel0'), $('#reel1'), $('#reel2')];
  reels.forEach(r=>{ if(r) r.classList.add('spinning'); r?.classList.remove('win'); });

  const spinInterval = setInterval(()=>{
    reels.forEach(r=>{ if(r) r.textContent = info.pool[Math.floor(Math.random()*info.pool.length)]; });
  }, 70);

  setTimeout(()=>{
    clearInterval(spinInterval);
    reels.forEach(r=>r?.classList.remove('spinning'));
    const result = [
      info.pool[Math.floor(Math.random()*info.pool.length)],
      info.pool[Math.floor(Math.random()*info.pool.length)],
      info.pool[Math.floor(Math.random()*info.pool.length)]
    ];
    reels.forEach((r, i)=>{ if(r) r.textContent = result[i]; });
    const allSame = result[0] === result[1] && result[1] === result[2];
    const allBust = result.every(x=>x === '🚫');
    if(allBust) reels.forEach(r=>r?.classList.add('win'));

    if(allSame && result[0] !== '🚫'){
      const icon = ICONS.find(i=>i.emoji === result[0]);
      const prize = icon ? icon.price : info.prize;
      S.score += prize; S.totalEarned += prize;
      updateScoreUI();
      reels.forEach(r=>r?.classList.add('win'));
      playSound('win');
      toast(`🎉 ${t('win_prize')} +${fmt(prize)}`);
      if(!S.specialAch.lucky){ S.specialAch.lucky = true; unlockSpecialAch('lucky'); }
      S.blockCount = 0; save();
      setTimeout(()=>{ checkAchievements(); }, 900);
      return;
    }

    if(result.filter(x=>x === '🚫').length >= 1){
      S.blockCount++;
      if(S.blockCount >= 3){ applyPenalty(); S.blockCount = 0; }
    } else { S.blockCount = 0; }
    save();

    const lotInfo = $('#screen-lottery .lot-info');
    if(lotInfo){
      const items = lotInfo.querySelectorAll('.lot-info-item');
      if(items[3]) items[3].innerHTML = `${t('block_counter')} 🚫<b>${S.blockCount}/3</b>`;
    }
    const lsVal = document.querySelector('.lot-score .ls-value');
    if(lsVal) lsVal.textContent = fmt(S.score);
    const sb = $('#spinBtn');
    if(sb) sb.disabled = S.score < info.cost;

    if(!allSame) playSound('lose');
    checkAchievements();
  }, 1200);
}

function applyPenalty(){
  const loss = Math.floor(S.score * 0.2);
  S.score = Math.max(0, S.score - loss);
  const sc = $('#scoreCard');
  if(sc){ sc.classList.add('penalty'); setTimeout(()=>sc.classList.remove('penalty'), 900); }
  const wrap = $('#tapWrap');
  if(wrap){
    const fp = document.createElement('div');
    fp.className = 'float-minus';
    fp.textContent = `-20% (-${fmtShort(loss)})`;
    fp.style.left = '50%'; fp.style.top = '50%';
    fp.style.transform = 'translateX(-50%)';
    fp.style.setProperty('--dx', '0px');
    wrap.appendChild(fp);
    setTimeout(()=>fp.remove(), 1500);
  }
  if(navigator.vibrate){ try{ navigator.vibrate([100,50,100,50,200]); }catch(e){} }
  playSound('lose');
  toast(`🚫 ${t('penalty')} -${fmt(loss)}`);

let _audioEl = null;
function startMusicStream(stream){
  if(_audioEl){ try{ _audioEl.pause(); }catch(e){} _audioEl = null; }
  if(!S.musicOn || !stream) return;
  const urls = {
    jazz: 'https://region-ru2.tunio.ai/jaz.aac',
    pop:  'https://region-ru2.tunio.ai/pop.aac',
    funk: 'https://region-ru2.tunio.ai/funk.aac'
  };
  const url = urls[stream];
  if(!url) return;
  try{
    _audioEl = new Audio(url);
    _audioEl.crossOrigin = 'anonymous';
    _audioEl.volume = 0.5;
    _audioEl.play().catch(()=>{});
  }catch(e){}
}
function toggleMusic(){
  S.musicOn = !S.musicOn;
  if(S.musicOn){
    if(!S.musicStream) S.musicStream = 'jazz';
    startMusicStream(S.musicStream);
  } else if(_audioEl){ try{ _audioEl.pause(); }catch(e){} _audioEl = null; }
  save();
}

function checkAchievements(){
  let changed = false;
  ACHIEVEMENTS.forEach(a=>{

    if(isAchUnlocked(a) && !S.unlockedAch.includes(a.id)){
      S.unlockedAch.push(a.id);
      changed = true;
      if(!S.achNotified.includes(a.id)){ S.achNotified.push(a.id); toastAch(a.emoji, a.name); }
    }
  });
  const allSpecial = ACHIEVEMENTS.filter(x=>x.type!=='special').every(x=>isAchUnlocked(x))
    && S.specialAch.rapid && S.specialAch.meloman && S.specialAch.decorator

function updateDailyHistory(){
  const key = todayKey();
  if(S.lastDayKey === null){
    S.lastDayKey = key; S.lastScoreSnapshot = S.score;
    if(S.history.length === 0) S.history.push({day:1, score:S.score, delta:0});
    save(); return;
  }
  if(S.lastDayKey !== key){
    const lastScore = S.lastScoreSnapshot;
    const delta = Math.max(0, S.score - lastScore);
    const nextDay = (S.history.length ? S.history[S.history.length-1].day : 0) + 1;
    S.history.push({day:nextDay, score:S.score, delta});
    S.lastDayKey = key; S.lastScoreSnapshot = S.score;
    S.daysPlayed = Math.max(S.daysPlayed, nextDay);
    save();
  } else {
    if(S.history.length === 0) S.history.push({day:1, score:S.score, delta:0});
    else {
      const last = S.history[S.history.length-1];
      const prevScore = S.history.length>1 ? S.history[S.history.length-2].score : 0;
      last.score = S.score;
      last.delta = Math.max(0, S.score - prevScore);
    }
    save();
  }
}

                            : 'Во вкладке «Бусты» покупай улучшения: за клик, за секунду и общий множитель.'},
    {emoji:'🎨', title: S.lang === 'en' ? 'Shop' : 'Магазин',
     text: S.lang === 'en' ? 'Buy themes, icons and wallpapers with points. Custom wallpapers unlock at 300 000 points.'
                            : 'Покупай темы, иконки и обои за очки. Кастомные обои откроются на 300 000 очков.'},
    {emoji:'🎰', title: S.lang === 'en' ? 'Lottery' : 'Лотерея',
     text: S.lang === 'en' ? 'From 1000 points and clicker level 3 open the Lottery. Four levels with growing wagers and prizes!'
                            : 'С 1000 очков и 3-го уровня кликера открой Лотерею. Четыре уровня с растущими ставками и призами!'},
    {emoji:'✨', title: S.lang === 'en' ? 'Animations' : 'Анимации',
     text: S.lang === 'en' ? 'At 1 000 000 points unlock background animations — leaves, rain, snow!'
                            : 'На 1 000 000 очков откроются анимации на фоне — листья, дождь, снежинки!'},
    {emoji:'🏆', title: S.lang === 'en' ? 'Achievements' : 'Достижения',
     text: S.lang === 'en' ? 'Collect achievements for points, days, clicks and special actions.'
                            : 'Собирай ачивки за очки, дни, клики и особые действия.'},
    {emoji:'🎵', title: S.lang === 'en' ? 'Music' : 'Музыка',
     text: S.lang === 'en' ? 'Turn on Jazz, Pop or Funk stream in Settings — listen and tap!'
                            : 'В настройках включи стрим Jazz, Pop или Funk — слушай и тапай!'}
  ];
  let idx = 0;
  const modal = $('#modalContent');
  function render(){
    const s = steps[idx];
    const dotsHtml = steps.map((_, i)=>`<span class="tut-dot ${i===idx?'active':''}"></span>`).join('');
    modal.innerHTML = `
      <div class="tut-wrap">
        <span class="big-emoji">${s.emoji}</span>
        <h2>${s.title}</h2>
        <p>${s.text}</p>
        <div class="tut-dots">${dotsHtml}</div>
        <div class="tut-nav">
          <button class="btn secondary" id="tutPrev" ${idx===0?'disabled':''}>${t('tut_prev')}</button>
          <button class="btn" id="tutNext">${idx === steps.length-1 ? t('tut_done') : t('tut_next')}</button>
        </div>
      </div>
    `;
    $('#tutPrev')?.addEventListener('click', ()=>{ if(idx > 0){ idx--; render(); } });
    $('#tutNext')?.addEventListener('click', ()=>{
      if(idx < steps.length-1){ idx++; render(); }
      else { S.tutorialSeen = true; save(); $('#modalBg').classList.remove('show'); }
    });
  }
  render();
  $('#modalBg').classList.add('show');
}

function bindNav(){
  $$('.top-tab, .nav-item').forEach(b=>{
    b.addEventListener('click', ()=>{
      const scr = b.dataset.screen;
      switchScreen(scr);
    });
  });
  $('#settingsTopBtn')?.addEventListener('click', ()=>switchScreen('settings'));
  $('#tutorialBtn')?.addEventListener('click', openTutorial);
  $('#tabTitle')?.addEventListener('click', ()=>{
    const bar = $('#topBar'); if(!bar) return;
    bar.classList.add('showGame');
    clearTimeout(bar._t);
    bar._t = setTimeout(()=>bar.classList.remove('showGame'), 2000);
  });
}

let _netWasOffline = false;
function showNetBanner(offline){
  const banner = $('#netBanner');
  const title = $('#netBannerTitle');
  const text = $('#netBannerText');
  if(!banner) return;
  if(offline){
    title.textContent = S.lang === 'en' ? 'Internet is gone, but the game continues!' : 'Интернет пропал, а игра продолжается!';
    text.textContent = S.lang === 'en'
      ? 'Keep playing even without internet! Some features may be unavailable, but will return when the internet is back.'
      : 'Продолжайте играть даже без интернета! Некоторые функции могут быть недоступны, но появятся при появлении интернета.';
    banner.classList.remove('ok');
    banner.classList.add('show');
  } else {
    title.textContent = S.lang === 'en' ? 'Internet is back!' : 'Интернет заработал!';
    text.textContent = '';
    banner.classList.add('ok');
    banner.classList.add('show');
    setTimeout(()=>{
      banner.classList.remove('show');
      setTimeout(()=>banner.classList.remove('ok'), 500);
    }, 2200);
  }
}

function initNetworkMonitor(){
  if(!navigator.onLine){
    _netWasOffline = true;
    showNetBanner(true);
  }
  window.addEventListener('offline', ()=>{
    _netWasOffline = true;
    showNetBanner(true);
  });
  window.addEventListener('online', ()=>{
    if(_netWasOffline){
      _netWasOffline = false;
      showNetBanner(false);
    }
  });
}

function renderAll(){
  renderShop(); renderTasks(); renderBoosts();
  renderClicker(); renderAch(); renderSettings();
  applyTheme(); updateScoreUI();
}

function runLoader(){
  const bar = $('#loadBar');
  const hint = $('#loadHint');
  const hints = ['Загрузка Galaxy Edition…','Подготовка кнопок…','Разогрев тапов…','Синхронизация очков…','Почти готово…'];
  const totalTime = 2000 + Math.random()*3000;
  const start = performance.now();
  let hintIdx = 0;
  function tick(now){
    const tt = Math.min(1, (now - start) / totalTime);
    bar.style.width = (tt*100)+'%';
    const ni = Math.min(hints.length-1, Math.floor(tt * hints.length));
    if(ni !== hintIdx){ hintIdx = ni; hint.textContent = hints[hintIdx]; }
    if(tt < 1) requestAnimationFrame(tick);
    else setTimeout(()=>{
      $('#loader').classList.add('hide');
      $('#app').classList.add('ready');
      switchScreen('clicker');
      if(!S.tutorialSeen) setTimeout(()=>openTutorial(), 400);
    }, 250);
  }
  requestAnimationFrame(tick);
}

function init(){
  if(!S.lastVisitDay){ S.lastVisitDay = todayKey(); S.daysPlayed = 1; save(); }
  applyLang(); applyTheme(); bindNav();
  renderBgAnimation();
  initNetworkMonitor();
  updateDailyHistory(); updateLotteryBadge(); checkAchievements(); checkAnimationsUnlock();

  setInterval(()=>{
    updateDailyHistory(); updateLotteryBadge(); save();
    if($('#screen-ach').classList.contains('active')) renderHistory($('.sort-tab.active')?.dataset.sort || 'day');
  }, 30000);

  setInterval(()=>{
    if(S.score >= 300000 && !S.customWallpaperUnlocked){
      S.customWallpaperUnlocked = true;
      if(!S.specialAch.decorator){ S.specialAch.decorator = true; unlockSpecialAch('decorator'); }
      save();
      toast('🎨 ' + t('wp_unlocked_toast'));
      for(let i=0;i<30;i++) setTimeout(()=>spawnConfetti(), i*80);
      if($('#screen-shop').classList.contains('active')) renderWallpapers();
      if($('#screen-settings').classList.contains('active')) renderSettingsWallpapers();
    }
    checkAnimationsUnlock();
  }, 2000);

  runLoader();
}
init();
</script>
</body>
